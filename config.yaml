# Настройки охотника за подарками. После правки на GitHub новые значения подхватятся со следующего скана.

# Какие коллекции смотреть (названия как в Telegram). Пусто = все, где есть лоты на перепродаже.
collections: []
exclude_collections: []

# Сколько лотов читать с каждой коллекции (самые дешёвые идут первыми)
pages_per_collection: 1
page_size: 100
request_delay_sec: 0.4      # пауза между запросами, чтобы Telegram не ограничивал
max_runtime_sec: 420        # не дольше 7 минут на скан

# Что считать находкой
max_price_stars: 0          # максимум цены в ⭐, 0 = без лимита (можно менять командой /budget)
rare_permille: 10           # атрибут редкий, если он у ≤ 1% подарков коллекции (10 из 1000)...
rare_ratio: 0.5             # ...и при этом минимум вдвое реже типичного атрибута этого вида в коллекции
rare_weights:               # сколько очков даёт редкость: модель сильнее всего влияет на цену, символ — слабее
  model: 3
  backdrop: 2
  symbol: 1
min_comparables: 2          # «дешевле аналогов» считаем, только если есть хотя бы 2 похожих лота
min_model_lots: 3           # цену модели оцениваем, если в продаже хотя бы 3 лота с ней
valued_model_premium: 1.2   # модель «ценится», если обычно стоит на 20%+ дороже типичного лота
min_model_discount: 0.25    # ...и лот с ней на 25%+ дешевле её обычной цены — это находка
falling_trend: 0.15         # коллекция «падает», если флор за сутки упал на 15%+ (минус очки и предупреждение)

# Вотчлист и сводка
watch_drop: 0.10            # писать, когда флор в вотчлисте упал на 10%+
digest_hour: 10             # во сколько присылать утреннюю сводку (местное время)
tz_offset_hours: 5          # твой часовой пояс относительно UTC (Ташкент = 5)
max_premium_for_rare: 1.6   # редкий лот интересен, если он дороже флора не больше чем в 1.6 раза
min_gap: 0.15               # лот на 15%+ дешевле следующего с той же моделью
low_number: 100             # номера #1–#100 считаются ценными
min_score: 4.5              # порог очков; выше = меньше, но жирнее находки (на 09.11.2026: ~60 на весь маркет)
max_alerts_per_run: 5       # не больше 5 уведомлений за скан

ton_to_stars_fallback: 200  # курс TON→⭐, если его не удалось посчитать из лотов
loop_interval_sec: 720      # скан раз в 12 минут в режиме `loop`: ~5 МБ за скан ≈ 0.6 ГБ в сутки (лимит FadeHost — 1 ГБ)

ai:
  enabled: true
  model: gemini-flash-lite-latest   # если не ответит, бот сам попробует другие бесплатные модели
  max_deals: 5
