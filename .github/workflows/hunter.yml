name: gift-hunter

# Бот теперь работает 24/7 на FadeHost (python main.py), поэтому здесь только ручной запуск —
# как запасной вариант. Чтобы вернуть автозапуск, добавь обратно:
#   schedule:
#     - cron: "*/10 * * * *"
# и не запускай одновременно с FadeHost: две копии дублируют уведомления.
on:
  workflow_dispatch: {}

concurrency:
  group: gift-hunter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: hunter-state-${{ github.run_id }}
          restore-keys: hunter-state-

      - name: Scan market
        run: python -m hunter run
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: hunter-state-${{ github.run_id }}
